<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1f44">
  <title>Form Pengajuan Barang — PT. Serasi Manunggal Sejahtera</title>
  <meta name="description" content="Form pengajuan barang cabang PT. Serasi Manunggal Sejahtera">
  <link rel="icon" href="https://i.ibb.co.com/tT0yKfBG/LOGO-SMS-white-shadow.png">
  <style>
    :root { --navy-950:#050e1f; --navy-900:#0a1f44; --navy-300:#8bb0db; --navy-100:#dde9f6; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; background:#e9eff7; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }

    /* Layar pemuatan (hilang otomatis saat iframe selesai load) */
    #pemuat {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(160deg, var(--navy-950), var(--navy-900) 60%, #143a73);
      color: #fff; text-align: center; padding: 24px;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #pemuat.sembunyi { opacity: 0; visibility: hidden; }
    #pemuat img { max-height: 54px; }
    #pemuat .judul { font-weight: 700; letter-spacing: .04em; font-size: .95rem; text-transform: uppercase; }
    #pemuat .sub { color: var(--navy-300); font-size: .8rem; }
    .spin {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.22); border-top-color: #fff;
      animation: putar .85s linear infinite;
    }
    @keyframes putar { to { transform: rotate(360deg); } }

    /* Kerangka aplikasi */
    #app {
      position: fixed; inset: 0;
      width: 100%; height: 100%; height: 100dvh;
      border: 0; display: block; background: #e9eff7;
    }

    /* Pesan jika URL belum diisi / gagal dimuat */
    #galat {
      position: fixed; inset: 0; z-index: 9; display: none;
      align-items: center; justify-content: center; padding: 24px;
      background: #e9eff7;
    }
    #galat .kotak {
      background: #fff; border-radius: 16px; padding: 24px; max-width: 420px;
      box-shadow: 0 18px 40px -22px rgba(10,31,68,.4); border-top: 4px solid var(--navy-900);
      color: #3c4f6d; font-size: .9rem; line-height: 1.55;
    }
    #galat h1 { font-size: 1rem; color: var(--navy-900); margin: 0 0 8px; }
    #galat code { background: var(--navy-100); padding: 2px 6px; border-radius: 5px; font-size: .82rem; }
  </style>
</head>
<body>

  <div id="pemuat">
    <img src="https://i.ibb.co.com/tT0yKfBG/LOGO-SMS-white-shadow.png" alt="Logo SMS">
    <div class="spin"></div>
    <div>
      <div class="judul">Form Pengajuan Barang</div>
      <div class="sub">PT. Serasi Manunggal Sejahtera</div>
    </div>
  </div>

  <div id="galat">
    <div class="kotak">
      <h1>Alamat aplikasi belum diatur</h1>
      <p>Isi variabel <code>URL_APPS_SCRIPT</code> di dalam file <code>index.html</code> dengan URL web app Apps Script yang berakhiran <code>/exec</code>, lalu deploy ulang ke Vercel.</p>
    </div>
  </div>

  <script>
    /* ============================================================
       SATU-SATUNYA BARIS YANG PERLU DIUBAH DI VERCEL.
       Tempel URL web app Apps Script Anda (akhiran /exec).
       Setelah ini, semua perubahan tampilan & logika cukup
       dilakukan di Apps Script -> Deploy -> Manage deployments ->
       Edit -> New version. Vercel tidak perlu disentuh lagi.
       ============================================================ */
    var URL_APPS_SCRIPT = "https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXXX/exec";

    (function () {
      var pemuat = document.getElementById('pemuat');
      var galat  = document.getElementById('galat');

      if (!URL_APPS_SCRIPT || URL_APPS_SCRIPT.indexOf('XXXXXX') !== -1 || URL_APPS_SCRIPT.indexOf('/exec') === -1) {
        pemuat.classList.add('sembunyi');
        galat.style.display = 'flex';
        return;
      }

      /* Teruskan query string (mis. ?id=PR-...) ke Apps Script */
      var tujuan = URL_APPS_SCRIPT + (window.location.search || '');

      var frame = document.createElement('iframe');
      frame.id = 'app';
      frame.src = tujuan;
      frame.setAttribute('title', 'Form Pengajuan Barang');
      frame.setAttribute('allow', 'clipboard-write; camera');
      frame.setAttribute('allowfullscreen', '');
      frame.addEventListener('load', function () {
        pemuat.classList.add('sembunyi');
      });
      document.body.appendChild(frame);

      /* Jaring pengaman: sembunyikan pemuat setelah 25 detik apa pun yang terjadi */
      setTimeout(function () { pemuat.classList.add('sembunyi'); }, 25000);
    })();
  </script>
</body>
</html>
